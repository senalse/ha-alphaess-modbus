name: Inverter compatibility report
description: Report whether the integration works, or does not work, with your inverter model
labels: ["compatibility"]
body:
  - type: input
    id: inverter-model
    attributes:
      label: Inverter model
      placeholder: "SMILE-G3 / Hyundai rebadge / etc."
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Inverter firmware / EMS version
      description: From the AlphaESS app or the local web interface, if you can see it.
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works fully
        - Works, but some entities are wrong or unavailable
        - Connects, but no data
        - Will not connect
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: Detail
      description: Which entities are wrong or missing, and anything you had to change to get it working.
